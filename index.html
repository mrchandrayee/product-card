<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Animated Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="glow-orb"></div>
        <div class="card">
            <div class="img-box">
                <div class="circle-bg"></div>
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Nike Air Max">
            </div>
            <div class="content">
                <span class="tag">New Release</span>
                <h2>Air Max Neo</h2>
                <p>Engineered with futuristic reactive cushioning for infinite energy return.</p>
                <div class="footer-row">
                    <span class="price">$159.00</span>
                    <button class="buy-btn">
                        <span>Buy Now</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
